# Wildcard certificate served by the Istio ingress gateway (Gateway credentialName:
# raai-site-tls). Must live in the gateway's namespace (istio-system).
#
# Renewal is automatic: cert-manager renews when 1/3 of the lifetime is left
# (30 days for Let's Encrypt's 90-day certs) and rotates the private key.
# For many clusters, use one name set per cluster (e.g. "*.dev.raai.site"),
# see README.md section 6.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: raai-site-tls
  namespace: istio-system
spec:
  secretName: raai-site-tls
  dnsNames:
    - raai.site
    - "*.raai.site"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
