apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-fulfillment
  namespace: temporal
  labels:
    app: prescription-fulfillment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prescription-fulfillment
  template:
    metadata:
      labels:
        app: prescription-fulfillment
    spec:
      containers:
        - name: worker
          image: prescription-fulfillment:0.1.1
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TASK_QUEUE
              value: prescription-fulfillment
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
