apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-scheduler
  namespace: temporal
  labels:
    app: appointment-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-scheduler
  template:
    metadata:
      labels:
        app: appointment-scheduler
    spec:
      containers:
        - name: worker
          image: appointment-scheduler:0.1.1
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TASK_QUEUE
              value: appointment-scheduler
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
