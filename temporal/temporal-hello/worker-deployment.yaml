apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-services
  namespace: temporal
  labels:
    app: patient-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-services
  template:
    metadata:
      labels:
        app: patient-services
    spec:
      containers:
        - name: worker
          image: patient-services:0.1.0
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TASK_QUEUE
              value: patient-services
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
