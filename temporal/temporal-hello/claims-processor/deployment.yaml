apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-processor
  namespace: temporal
  labels:
    app: claims-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-processor
  template:
    metadata:
      labels:
        app: claims-processor
    spec:
      containers:
        - name: worker
          image: claims-processor:0.1.1
          imagePullPolicy: IfNotPresent # image is loaded into kind, not pulled
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TASK_QUEUE
              value: claims-processor
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
