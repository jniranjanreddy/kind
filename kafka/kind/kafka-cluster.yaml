# Single-node, KRaft-mode Kafka cluster (no ZooKeeper — removed in Strimzi 1.x)
# sized for a local dev cluster. Ephemeral storage keeps this free of any
# StorageClass dependency; resources/jvmOptions are trimmed down since this
# shares the node with other dev workloads.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: ephemeral
        kraftMetadata: shared
  resources:
    requests:
      memory: 1Gi
      cpu: "250m"
    limits:
      memory: 1Gi
      cpu: "500m"
  jvmOptions:
    "-Xms": "512m"
    "-Xmx": "512m"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
