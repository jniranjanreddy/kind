# Attu: official web UI for Milvus (browse collections, run vector
# searches, manage indexes/partitions). https://github.com/zilliztech/attu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attu
  labels:
    app: attu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attu
  template:
    metadata:
      labels:
        app: attu
    spec:
      containers:
        - name: attu
          # Pinned to v2.6.5 deliberately: :latest/v3.0 turned out to be a
          # September 2026 rewrite with its own tenant/billing/login system
          # (empty user DB, no default credentials, requires signing up at
          # /login). v2.6.5 is the classic, no-login Attu — just point it at
          # a Milvus address and browse, matching every existing guide.
          image: zilliz/attu:v2.6.5
          ports:
            - containerPort: 3000
          env:
            - name: MILVUS_URL
              value: milvus:19530
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: attu
spec:
  selector:
    app: attu
  ports:
    - port: 3000
      targetPort: 3000
