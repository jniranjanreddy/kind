# Mongo Express: web UI for browsing/editing MongoDB databases and
# collections. https://github.com/mongo-express/mongo-express
#
# Pinned to a specific tag rather than :latest — Docker Hub's "mongo-express"
# lost official-image status (flagged "DEPRECATED" there) but the upstream
# project is still actively maintained; this is its most recent published
# image.
#
# This 1.0.2 build actually gates its basic-auth wall on the older
# ME_CONFIG_BASICAUTH variable, not ME_CONFIG_BASICAUTH_ENABLED as current
# upstream docs describe (verified: setting only _ENABLED=false still left
# the UI behind a 401 with default admin:pass credentials, per its own
# startup log). Setting both covers whichever this specific build honors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2-20-alpine3.19
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://root:MongoDevPassword@mongodb:27017/?authSource=admin"
            - name: ME_CONFIG_BASICAUTH
              value: "false"
            - name: ME_CONFIG_BASICAUTH_ENABLED
              value: "false"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /status
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
spec:
  selector:
    app: mongo-express
  ports:
    - port: 8081
      targetPort: 8081
