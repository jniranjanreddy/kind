# Adminer: single-file web UI for browsing/querying the pgvector Postgres
# instance (and any other DB you point it at). https://www.adminer.org/
#
# Unlike Mongo Express/Kafdrop in the other stacks, Adminer does require a
# login form — that's normal for a database admin tool (it's a login to
# Postgres itself, not a separate broken auth layer). Server field is
# pre-filled via ADMINER_DEFAULT_SERVER; see README for full credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    app: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:latest
          ports:
            - containerPort: 8080
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: pgvector
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 150m
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
spec:
  selector:
    app: adminer
  ports:
    - port: 8080
      targetPort: 8080
