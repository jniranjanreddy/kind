# Initial deploy uses :latest since no image exists on Docker Hub until
# https://github.com/jniranjanreddy/fastapi-demo's CI has run at least once
# (push to main there + add its DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets
# first). Until then this pod sits in ImagePullBackOff — expected.
#
# For the actual GitOps demo (a manifest change driving a sync), switch
# `image:` below to the specific `jniranjanreddy/fastapi-demo:<commit-sha>`
# tag CI pushes, then commit + push this file to this branch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-demo
  labels:
    app: fastapi-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-demo
  template:
    metadata:
      labels:
        app: fastapi-demo
    spec:
      containers:
        - name: fastapi-demo
          image: nirulabs/fastapi-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-demo
spec:
  selector:
    app: fastapi-demo
  ports:
    - port: 8000
      targetPort: 8000
